title: Saso Studio
description: 1인 스튜디오 — 게임과 AI 에이전트 도구를 만들어 출시하고, 만드는 과정을 전부 공개합니다. A one-person studio — games, agents, and AI tooling, built in public.
url: "https://saso-studio.vercel.app"
baseurl: ""
author: CHPARK03
lang: ko
timezone: Asia/Seoul
logo: /assets/img/saso-logo.jpg

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      image: /assets/img/saso-logo.jpg

permalink: /:year/:month/:day/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - vercel.json
  - redirects
